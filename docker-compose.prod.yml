# EC2 production: Next.js app → existing AWS RDS.
# Do not commit .env. Create it on the instance.
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${RDS_HOST}:5432/postgres
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${RDS_HOST}:5432/postgres
    ports:
      - "80:3000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
