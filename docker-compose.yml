services:
  postgres:
    image: postgres:16-alpine
    container_name: lmnt-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: lmnt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmnt_dev}
      POSTGRES_DB: lmnt_coach_os
    volumes:
      - lmnt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmnt -d lmnt_coach_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lmnt_pg_data:
